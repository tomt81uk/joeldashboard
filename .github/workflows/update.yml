name: Refresh dashboard data

on:
  schedule:
    - cron: '17 5 * * *'   # every day, 05:17 UTC
  push:
    paths:
      - 'data/data.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate, archive old items and refresh counts
        run: node scripts/update.mjs

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "dashboard-bot"
            git config user.email "dashboard-bot@users.noreply.github.com"
            git add data
            git commit -m "chore: refresh dashboard data"
            git push
          else
            echo "Nothing to commit."
          fi
